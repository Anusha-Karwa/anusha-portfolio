<body>
<canvas id="gl" aria-hidden="true"></canvas>

<div id="loader" role="status">

  <h1>Anusha <em>Karwa</em></h1>

  <p class="mono" id="lstat">Casting the gold…</p>

    <button class="cta" id="go">Play</button>
    <button class="cta ghost" id="goSound">Play with sound</button>
  </div>
  <button class="textlink" id="loaderResume">Read the résumé instead</button>
</div>

<div id="caption" class="caption" aria-live="polite">
  <p id="capSec" class="sec"></p>
  <p id="capSub" class="sub"></p>
  <p id="capDet" class="det"></p>
  <div id="finale" class="finale" hidden>

</div>

<div id="ui">
  <header>
    <span class="brand">ak.</span>
    <span id="chapter" class="chapter">Anusha Karwa</span>
    <nav class="hbtns">
      <button class="pill" id="resBtn" aria-expanded="false" aria-controls="resume">Résumé</button>
      <a class="pill" href="/journey">River journey</a>
      <button class="pill" id="snd" aria-pressed="false">Sound off</button>
    </nav>
  </header>
  <footer>
    <button class="pill round" id="prev" aria-label="Previous">&#8592;</button>
    <button class="pill" id="pp" aria-pressed="false">Pause</button>
    <button class="pill round" id="next" aria-label="Next">&#8594;</button>
    <div id="progress" class="progress" role="slider" aria-label="Timeline"><span id="bar"></span></div>
  </footer>
</div>

<section id="resume" hidden aria-label="Résumé">
  <div class="sheet">
    <button class="pill close" id="resumeClose">Back to the film</button>
    <div id="resumeBody"></div>
  </div>
</section>
